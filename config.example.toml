# SonsAnalyzer configuration. Copy to config.toml and adjust.
# All values shown are the defaults.

[app]
# "influx" = read real boat data from InfluxDB, "demo" = built-in simulated races (no database needed)
source = "influx"
host = "0.0.0.0"
port = 8080
# Where SQLite database, polar and map tile cache are stored
data_dir = "data"

[boat]
name = "Sons of Hurricanes"
sail_no = "NOR 15666"

[influx]
host = "localhost"
port = 8086
database = "boatdata"
username = ""
password = ""
# Optional extra InfluxQL condition, e.g. "\"context\" = 'vessels.urn:mrn:imo:mmsi:257000000'"
extra_where = ""

[analysis]
smoothing_s = 3            # rolling window for smoothing angles and speeds
upwind_max_twa = 70        # |TWA| below this = upwind
downwind_min_twa = 110     # |TWA| above this = downwind
hysteresis_deg = 5
min_leg_s = 90             # shorter mode changes are merged into neighbouring legs
maneuver_window_before_s = 10
maneuver_window_after_s = 30
session_min_sog_kn = 2.0
session_min_minutes = 15
session_max_gap_minutes = 10
