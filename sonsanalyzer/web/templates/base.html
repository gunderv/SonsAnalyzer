<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}SonsAnalyzer{% endblock %} · {{ boat.name }}</title>
  <link rel="stylesheet" href="/static/app.css">
  {% block head %}{% endblock %}
</head>
<body>
<header class="top">
  <a class="brand" href="/">SonsAnalyzer<small>{{ boat.name }} · {{ boat.sail_no }}</small></a>
  {% if source == "demo" %}<span class="badge" title="Showing simulated races, not boat data">DEMO</span>{% endif %}
  <nav>
    <a href="/" class="{{ 'active' if active == 'races' }}">Races</a>
    <a href="/polar" class="{{ 'active' if active == 'polar' }}">Polar</a>
    <a href="/live" class="{{ 'active' if active == 'live' }}">Live</a>
  </nav>
</header>
<main>
  {% block content %}{% endblock %}
</main>
<script src="/static/app.js"></script>
{% block scripts %}{% endblock %}
</body>
</html>
